# Global mise tool versions. Per-project overrides go in each project's mise.toml.
#
# CLI tools below mirror the versions baked into base/Dockerfile (see the cli-tools
# stage). This file is for HOST-SIDE version management parity only — inside the
# container these tools are system-installed in /usr/local/bin by the image build.
# Run `mise install` on your Mac to get the same versions locally.
#
# Tools without a pinned version in the Dockerfile (starship, lazydocker, hadolint)
# are set to "latest" here to match that behaviour.
[tools]
node = "lts"
go = "latest"

# --- CLI tools (mirrors base/Dockerfile cli-tools stage) ---
"ubi:starship-rs/starship"       = "latest"   # no version pin in Dockerfile
"ubi:ajeetdsouza/zoxide"         = "0.9.6"
"ubi:atuinsh/atuin"              = "18.4.0"
"ubi:jesseduffield/lazydocker"   = "latest"   # no version pin in Dockerfile
"ubi:wagoodman/dive"             = "0.13.1"
"ubi:bcicen/ctop"                = "0.7.7"
"ubi:hadolint/hadolint"          = "latest"   # no version pin in Dockerfile
