# lazydocker — opinionated defaults for the devbox.
# Path inside the container after install.sh runs:
#   ~/.config/jesseduffield/lazydocker/config.yml
# Symlink target:
#   ~/.dotfiles-sample/.config/jesseduffield/lazydocker/config.yml
gui:
  scrollHeight: 2
  scrollPastBottom: true
  sidePanelWidth: 0.3333
  showAllContainers: true
  expandFocusedSidePanel: false
  language: 'auto'
  theme:
    activeBorderColor: ['green', 'bold']
    inactiveBorderColor: ['default']
    optionsTextColor: ['blue']
logs:
  timestamps: false
  since: '60m'                # default log tail window
  tail: ''
commandTemplates:
  dockerCompose: 'docker compose'
  restartService: '{{ .DockerCompose }} restart {{ .Service.Name }}'
  up: '{{ .DockerCompose }} up -d'
  down: '{{ .DockerCompose }} down'
  downWithVolumes: '{{ .DockerCompose }} down --volumes'
  upService: '{{ .DockerCompose }} up -d {{ .Service.Name }}'
  startService: '{{ .DockerCompose }} start {{ .Service.Name }}'
  stopService: '{{ .DockerCompose }} stop {{ .Service.Name }}'
  serviceLogs: '{{ .DockerCompose }} logs --tail=200 --follow --timestamps {{ .Service.Name }}'
  viewServiceLogs: '{{ .DockerCompose }} logs --tail=200 --follow --timestamps {{ .Service.Name }}'
  rebuildService: '{{ .DockerCompose }} up -d --build {{ .Service.Name }}'
  recreateService: '{{ .DockerCompose }} up -d --force-recreate {{ .Service.Name }}'
  allLogs: '{{ .DockerCompose }} logs --tail=200 --follow'
  viewAllLogs: '{{ .DockerCompose }} logs'
  dockerComposeConfig: '{{ .DockerCompose }} config'
  checkDockerComposeConfig: '{{ .DockerCompose }} config --quiet'
  serviceTop: '{{ .DockerCompose }} top {{ .Service.Name }}'
oversizedContainers: false
update:
  dockerRefreshInterval: '5s'
confirmOnQuit: false
