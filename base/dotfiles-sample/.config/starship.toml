# starship — fast, lazy, cross-shell prompt
# Edit and re-source (`exec zsh`) to test changes. No restart needed.

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$docker_context\
$nodejs\
$rust\
$python\
$golang\
$cmd_duration\
$character"""

[character]
success_symbol = "[›](bold green)"
error_symbol   = "[›](bold red)"
vimcmd_symbol  = "[<](bold green)"

[directory]
truncation_length     = 3
truncate_to_repo      = true
truncation_symbol     = "…/"
style                 = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
ahead       = "↑${count}"
behind      = "↓${count}"
diverged    = "↑${ahead_count}↓${behind_count}"
conflicted  = "!"
untracked   = "?"
stashed     = "$"
modified    = "✱"
staged      = "+"
renamed     = "»"
deleted     = "✘"

[docker_context]
only_with_files = true
format          = "[$symbol$context]($style) "
symbol          = " "

[nodejs]
format          = "[$symbol($version )]($style)"
detect_files    = ["package.json", ".nvmrc"]

[rust]
format          = "[$symbol($version )]($style)"

[python]
format          = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[golang]
format          = "[$symbol($version )]($style)"

[cmd_duration]
min_time        = 2000
format          = "[took $duration]($style) "
style           = "yellow"
