# bogan-term art catalog
#
# Each piece has:
#   slug         unique key
#   display_name human-readable
#   category     iconic | wildlife | scenery | portraits | characters
#   source       one of: builtin | photo | placeholder
#                builtin   = `art` field below is used directly
#                photo     = render via chafa from ~/.config/bogan-term/photos/<slug>/*
#                placeholder = no art yet; show a labelled box
#
# Web fetch is OUT OF SCOPE for this pass.
# Drop your own photos into ~/.config/bogan-term/photos/<slug>/ to use the photo source.

