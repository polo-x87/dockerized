### Modern Essentials Preset (`~/.tmux.conf`)
# =============================================
# MODERN TMUX 2026 PRESET
# =============================================

# 1. CORE SETTINGS
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # Enable True Color (RGB)
set -g mouse on                                 # Modern mouse support
set -s escape-time 0                            # Fix Vim/Neovim ESC delay
set -g history-limit 50000                      # Large scrollback buffer
set -g focus-events on                          # Let apps know when they have focus
set -g base-index 1                             # Start windows at 1 (easier to reach)
setw -g pane-base-index 1                       # Start panes at 1
set -g renumber-windows on                      # Auto-renumber on close

# 2. KEY BINDINGS (Ergonomic)
unbind C-b
set -g prefix C-a                               # C-a is easier than C-b
bind C-a send-prefix
# Create a shortcut (Prefix + h) to toggle a cheat sheet popup
bind h display-popup -E "cat ~/tmux_cheatsheet.txt || echo 'Create ~/tmux_cheatsheet.txt first'; read -n 1"
bind ? display-popup -E "tmux list-keys | less"

# Better Splitting (keeps current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Modern Popup Toggle (Requires tmux 3.2+)
# Use Prefix + g for a floating Git UI, Prefix + t for a floating terminal
bind g display-popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E "lazygit"
bind t display-popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E "$SHELL"

# 3. EXTENDED KEYS (Tmux 3.5+)
# Allows recognition of complex combos like C-Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 4. PLUGINS (Managed via TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'         # System clipboard integration
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist sessions after reboot
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'catppuccin/tmux'                # Modern aesthetics
set -g @plugin 'sainnhe/tmux-fzf'               # fzf for session management

# Plugin Config: Catppuccin
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded"

# Initialize TPM (Keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

